<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(4, 1fr);
    }
    
    .cell {
      padding: 10px;
      background-color: #eee;
      border: 3px solid #000;
      border-radius: 10px;
      grid-column: span var(--column, 1);
      &::after {
        content: " (grid-column: span " var(--column) ";)"
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="cell" style="--column: 1;">1</div>
    <div class="cell" style="--column: 3;">2</div>
    <div class="cell" style="--column: 3;">3</div>
    <div class="cell" style="--column: 1;">4</div>
  </div>
</body>
</html>
